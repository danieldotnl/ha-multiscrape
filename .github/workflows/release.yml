name: "Release"

on:
  release:
    types:
      - "published"

permissions: {}

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7"

      - name: "Adjust version number"
        shell: "bash"
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          yq -i -o json ".version=\"${TAG#v}\"" \
            "${{ github.workspace }}/custom_components/multiscrape/manifest.json"

      - name: "ZIP the integration directory"
        shell: "bash"
        run: |
          cd "${{ github.workspace }}/custom_components/multiscrape"
          zip multiscrape.zip -r ./ -x "__pycache__/*"

      - name: "Upload the ZIP file to the release"
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ github.workspace }}/custom_components/multiscrape/multiscrape.zip
